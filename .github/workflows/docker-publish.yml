name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"   # Triggers on version tags like v1.13.1, v1.14.0, etc.

jobs:
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract version from the git tag (strips leading 'v', e.g. v1.13.1 → 1.13.1)
      - name: Extract version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building image version: $VERSION"

      # Set up QEMU for cross-platform builds (arm64 support)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for multi-platform & cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to DockerHub using repo secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push with both versioned tag and :latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Build only for amd64 since isolate + cgroups need Linux x86_64
          platforms: linux/amd64
          tags: |
            bitmutex/judge0-custom:latest
            bitmutex/judge0-custom:${{ steps.meta.outputs.version }}
          # Use GitHub Actions cache to speed up layer caching across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ISOLATE_VERSION=2.2.1
